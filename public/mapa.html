<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapa · Foody Monitor</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1220; --panel: #111a2e; --panel2: #16233d; --line: #1f2d4a;
    --txt: #e6edf7; --mut: #8ba0c0;
    --green:#22c55e; --blue:#3b82f6; --yellow:#eab308; --orange:#f97316; --red:#ef4444; --slate:#94a3b8;
  }
  html, body { height: 100%; background: var(--bg); color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .top { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: linear-gradient(180deg,#101a30,#0d1526); border-bottom: 1px solid var(--line); }
  .brand { color: #ff7a2f; font-weight: 800; font-size: 15px; letter-spacing: .3px; }
  .brand small { color: var(--mut); font-weight: 600; font-size: 11px; margin-left: 6px; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.off { background: var(--red); box-shadow: 0 0 8px var(--red); }

  .wrap { display: flex; height: calc(100% - 48px); }
  .side { width: 320px; min-width: 320px; background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 10px; }
  .side h2 { font-size: 11px; letter-spacing: 1px; color: var(--mut); text-transform: uppercase; margin: 4px 4px 10px; }
  #map { flex: 1; height: 100%; background: #0a1322; }

  .ccard { background: var(--panel2); border: 1px solid var(--line); border-left-width: 4px;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 9px; cursor: pointer; transition: border-color .15s; }
  .ccard:hover { border-color: #2d4066; }
  .ccard .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ccard .nm { font-weight: 700; font-size: 14px; }
  .ccard .badge { font-size: 9.5px; font-weight: 800; letter-spacing: .5px; padding: 3px 7px; border-radius: 20px; text-transform: uppercase; white-space: nowrap; }
  .ccard .sub { color: var(--mut); font-size: 11px; margin-top: 2px; }
  .ccard .meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
  .chip { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 12px; background: #0e1830; border: 1px solid var(--line); color: #b9c8e0; }
  .chip.go { color: var(--blue); border-color: #1e3358; }
  .parked { font-size: 11px; font-weight: 700; margin-top: 6px; }
  .parked.wait { color: var(--slate); }
  .parked.stop { color: var(--orange); }
  .empty { color: var(--mut); font-size: 12px; text-align: center; padding: 20px 8px; }

  .b-green  { color: var(--green);  background: rgba(34,197,94,.14); }
  .b-blue   { color: var(--blue);   background: rgba(59,130,246,.16); }
  .b-yellow { color: var(--yellow); background: rgba(234,179,8,.16); }
  .b-red    { color: var(--red);    background: rgba(239,68,68,.16); }
  .bl-green  { border-left-color: var(--green); }
  .bl-blue   { border-left-color: var(--blue); }
  .bl-yellow { border-left-color: var(--yellow); }
  .bl-red    { border-left-color: var(--red); }

  /* Pinos no mapa */
  .cpin { position: relative; }
  .cpin .dotp { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #0b1220;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.5); }
  .cpin .lbl { position: absolute; left: 20px; top: -3px; white-space: nowrap; font-size: 11px; font-weight: 800;
    color: #fff; background: rgba(13,21,38,.9); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); }
  .store-pin { font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .leaflet-container { background: #0a1322; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #16233d; color: var(--txt); }
  .leaflet-popup-content { font-size: 12.5px; }
  .leaflet-popup-content b { color: #fff; }

  @media (max-width: 820px) {
    .wrap { flex-direction: column; }
    #map { height: 52vh; width: 100%; order: -1; }
    .side { width: 100%; min-width: 0; height: auto; border-right: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Mapa <small>Foody Monitor · privado</small></div>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">conectando…</span></div>
  </div>
  <div class="wrap">
    <div class="side">
      <h2>Entregadores</h2>
      <div id="list"><div class="empty">carregando…</div></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="/vendor/leaflet.js"></script>
  <script>
    const TOKEN = decodeURIComponent((location.pathname.split('/m/')[1] || '').replace(/\/+$/, ''));
    const STORE_DEFAULT = [-9.533908716397399, -35.77956519016071];

    const map = L.map('map', { zoomControl: true, attributionControl: true }).setView(STORE_DEFAULT, 14);

    // ── Camadas de mapa (seletor no canto). Só as que NÃO precisam de chave entram agora;
    // MapTiler (igual Foody) e Google Maps entram quando o John gerar as chaves. ──
    const E = 'https://services.arcgisonline.com/arcgis/rest/services/';
    // Escuro (Esri Dark Gray): base + nomes das quadras.
    const escuro = L.layerGroup([
      L.tileLayer(E + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',      { maxZoom: 19, maxNativeZoom: 16, attribution: '&copy; Esri' }),
      L.tileLayer(E + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 16 }),
    ]);
    // Ruas claro (parecido com o do Foody) — OpenStreetMap, sem chave.
    const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      subdomains: 'abc', maxZoom: 19, attribution: '&copy; OpenStreetMap'
    });
    // Satélite (Esri World Imagery) — sem chave, dá uma prévia do que o Google faria.
    const satelite = L.tileLayer(E + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, attribution: '&copy; Esri' });

    escuro.addTo(map); // padrão
    L.control.layers(
      { '🌙 Escuro': escuro, '🗺️ Ruas': ruas, '🛰️ Satélite': satelite },
      null, { position: 'topright', collapsed: true }
    ).addTo(map);

    let storeMarker = null, storeCircle = null, centeredOnce = false, lastCouriers = [];
    const markers = {}; // id -> L.marker

    function hex(c) {
      return { 'available':'#22c55e','delivering':'#3b82f6','warning':'#eab308','alert':'#ef4444','missing':'#ef4444' }[c.status]
        || (c.status==='delivering' ? '#3b82f6' : '#94a3b8');
    }
    function pinColor(c) {
      if (c.status === 'delivering' && c.parkedAtStore === false && isParked(c)) return '#f97316';
      return hex(c);
    }
    function isParked(c) { return c.status === 'delivering' && c.stSince && (Date.now() - c.stSince) > 120000; }
    function fmtDur(ms) {
      if (!ms || ms < 0) ms = 0; const s = Math.floor(ms/1000);
      const m = Math.floor(s/60), r = s%60; return m + ':' + String(r).padStart(2,'0');
    }
    function badgeOf(c) {
      switch (c.status) {
        case 'available': return ['b-green','bl-green','Disponível'];
        case 'delivering': return ['b-blue','bl-blue','Em entrega'];
        case 'warning': return ['b-yellow','bl-yellow','Atenção'];
        case 'alert': return ['b-red','bl-red','Alerta'];
        case 'missing': return ['b-red','bl-red','Sumiu'];
        default: return ['b-blue','bl-blue', c.status || '—'];
      }
    }

    function render(state) {
      if (!state || state.restricted) { document.getElementById('list').innerHTML = '<div class="empty">sem acesso (link inválido)</div>'; return; }
      // Loja + raio
      const st = state.store && typeof state.store.lat === 'number' ? [state.store.lat, state.store.lng] : STORE_DEFAULT;
      if (!storeMarker) {
        storeMarker = L.marker(st, { icon: L.divIcon({ className: '', html: '<div class="store-pin">🏠</div>', iconSize: [24,24], iconAnchor: [12,22] }) }).addTo(map).bindPopup('<b>Varanda\'s Pizzaria</b>');
        storeCircle = L.circle(st, { radius: state.returnRadiusM || 2000, color: '#ff7a2f', weight: 1, opacity: .5, fillColor: '#ff7a2f', fillOpacity: .04 }).addTo(map);
      } else { storeMarker.setLatLng(st); storeCircle.setLatLng(st); }
      if (!centeredOnce) { map.setView(st, 14); centeredOnce = true; }

      const couriers = (state.couriers || []).slice();
      lastCouriers = couriers;
      const seen = new Set();
      for (const c of couriers) {
        if (typeof c.lat !== 'number' || typeof c.lng !== 'number') continue;
        const key = String(c.id);
        seen.add(key);
        const color = pinColor(c);
        const html = `<div class="cpin"><div class="dotp" style="background:${color}"></div><div class="lbl">${c.name}</div></div>`;
        const icon = L.divIcon({ className: '', html, iconSize: [16,16], iconAnchor: [8,8] });
        if (markers[key]) { markers[key].setLatLng([c.lat, c.lng]).setIcon(icon); }
        else { markers[key] = L.marker([c.lat, c.lng], { icon }).addTo(map); }
        markers[key].bindPopup(popupHtml(c));
      }
      for (const id in markers) { if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; } }

      renderList(couriers);
      const dot = document.getElementById('liveDot'), txt = document.getElementById('liveTxt');
      dot.className = state.sessionOk === false ? 'dot off' : 'dot';
      txt.textContent = 'ao vivo · ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }

    function popupHtml(c) {
      const [, , label] = badgeOf(c);
      const held = (c.heldOrders||[]).filter(h=>h.num!=null).map(h=>'#'+h.num).join(', ');
      let p = `<b>${c.name}</b> · ${label}`;
      if (c.activeOrderCount) p += `<br>${c.activeOrderCount} pedido(s)${held ? ' — ' + held : ''}`;
      if (isParked(c)) p += `<br>${c.parkedAtStore ? '⏳ aguardando' : '📍 parado'} há ${fmtDur(Date.now()-c.stSince)}`;
      if (c.lat) p += `<br><a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" style="color:#7ab0ff">ver no Google Maps</a>`;
      return p;
    }

    function renderList(couriers) {
      if (!couriers.length) { document.getElementById('list').innerHTML = '<div class="empty">nenhum entregador online</div>'; return; }
      const order = { alert:0, missing:1, warning:2, delivering:3, available:4 };
      couriers.sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
      document.getElementById('list').innerHTML = couriers.map(c => {
        const [bcls, lcls, label] = badgeOf(c);
        const held = (c.heldOrders||[]).filter(h=>h.num!=null);
        const chips = held.map(h=>`<span class="chip ${h.status==='onGoing'?'go':''}">#${h.num}</span>`).join('');
        let parked = '';
        if (isParked(c)) parked = `<div class="parked ${c.parkedAtStore?'wait':'stop'}">${c.parkedAtStore?'⏳ aguardando há ':'📍 parado há '}${fmtDur(Date.now()-c.stSince)}</div>`;
        const veic = c.vehicleType === 'motorcycle' ? '🏍️ Moto' : '🚗 Carro';
        return `<div class="ccard ${lcls}" data-id="${c.id}">
          <div class="row1"><div class="nm">${c.name}</div><div class="badge ${bcls}">${label}</div></div>
          <div class="sub">${veic}${c.noGps?' · 📵 sem GPS':''}${c.lastOrderNumber?' · último #'+c.lastOrderNumber:''}</div>
          ${parked}
          ${chips?`<div class="meta">${chips}</div>`:''}
        </div>`;
      }).join('');
      document.querySelectorAll('.ccard').forEach(el => el.onclick = () => {
        const m = markers[el.dataset.id] || markers[+el.dataset.id];
        if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
      });
    }

    // Stream ao vivo (SSE) com o token; fallback pra poll se cair.
    let es = null;
    function connect() {
      es = new EventSource('/api/stream?k=' + encodeURIComponent(TOKEN));
      es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
      es.onerror = () => { document.getElementById('liveDot').className = 'dot off'; };
    }
    connect();
    // Re-render leve a cada 1s só pra os cronômetros "parado/aguardando há X" andarem entre os polls.
    setInterval(() => { if (lastCouriers.length) renderList(lastCouriers); }, 1000);
  </script>
</body>
</html>
